name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          version: "0.12.3"
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --extra test
      - name: Verify lockfile
        run: uv lock --check
      - name: Unit tests and coverage
        run: uv run pytest --cov=src --cov-report=term-missing --cov-fail-under=85
      - name: Integration tests
        run: uv run pytest -m integration --no-cov
      - name: Type check
        run: uv run --with mypy mypy src --ignore-missing-imports --follow-imports=skip --disable-error-code=var-annotated --disable-error-code=misc --disable-error-code=attr-defined --disable-error-code=union-attr
      - name: Build package
        run: uv build
