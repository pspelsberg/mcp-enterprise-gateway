[project]
name = "mcp-enterprise-gateway"
version = "0.1.0"
description = "Local MCP privacy, knowledge and Docker sandbox gateway"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastmcp>=2.0,<3",
  "mcp>=1.0,<2",
  "pydantic>=2.0,<3",
  "lancedb>=0.6",
  "presidio-analyzer>=2.2",
  "presidio-anonymizer>=2.2",
  "spacy>=3.7,<4",
  "docker>=7.0,<8",
  "pyarrow>=14",
  "numpy>=1.26,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5"]

[project.scripts]
mcp-enterprise-gateway = "src.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a live LanceDB/Docker environment"]
addopts = "-q -m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85

[tool.ruff]
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["src", "okf"]

[tool.hatch.build.targets.sdist]
include = ["src/**", "okf/**", "README.md", "pyproject.toml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
